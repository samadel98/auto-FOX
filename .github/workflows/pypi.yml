name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install build twine

      - name: Python info
        run: |
          which python
          python --version

      - name: Installed packages
        run: pip list

      - name: Build the package
        run: python -m build --sdist --wheel

      - name: Validate wheels
        run: |
          tree dist
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: ./dist/*

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    # Uses PyPI trusted publishing; the publisher (this repository, `pypi.yml`
    # and the `pypi` environment) must be registered with the PyPI project
    environment:
      name: pypi
      url: https://pypi.org/p/Auto-FOX
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels
          path: dist/

      - name: Publish the package
        uses: pypa/gh-action-pypi-publish@release/v1

  release-assets:
    name: Attach wheels to GitHub release
    if: github.event_name == 'release'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels
          path: dist/

      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --repo "$GITHUB_REPOSITORY"
