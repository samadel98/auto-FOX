# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Tests

on:
    push:
        branches:
            - master
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

env:
    PY_COLORS: '1'
    CP2K_VERSION: '2026.2'

jobs:
    build:
        name: ${{ matrix.os }} (py ${{ matrix.version }}${{ matrix.special }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                version: ['3.10', '3.11', '3.12', '3.13', '3.14']
                special: ['']
                include:
                    # QMFlows master still pins numpy<2, which has no Python 3.13 wheels
                    -   os: ubuntu-latest
                        special: '; pre-release'
                        version: '3.12'
                    -   os: ubuntu-latest
                        special: '; minimum version'
                        version: '3.10'
        env:
            CP2K_DATA_DIR: /usr/share/cp2k/data

        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
                    persist-credentials: false

            -   name: Set up Python
                uses: actions/setup-python@v7
                with:
                    python-version: ${{ matrix.version }}

            -   name: Install CP2K
                if: startsWith(matrix.os, 'ubuntu')
                run: |
                    curl -Lsf "https://github.com/cp2k/cp2k/releases/download/v${CP2K_VERSION}/cp2k-${CP2K_VERSION}-Linux-gnu-x86_64.ssmp" -o /usr/local/bin/cp2k.ssmp
                    chmod u+rx /usr/local/bin/cp2k.ssmp

            -   name: Info CP2K
                if: startsWith(matrix.os, 'ubuntu')
                run: cp2k.ssmp --version

            -   name: Install dependencies
                run: |
                    if [[ "${{ matrix.special }}" == '; pre-release' ]]; then
                        pip install --pre -e .[test-no-optional] --upgrade --force-reinstall
                        # The QMFlows fork and the newest PLAMS: no QMFlows release supports PLAMS >= 2024 yet,
                        # hence the `plams<2024` cap in pyproject.toml
                        pip install git+https://github.com/samadel98/qmflows@master --upgrade
                        pip install git+https://github.com/NLeSC/noodles@master --upgrade
                        pip install --pre plams rdkit --upgrade
                    elif [[ $SPECIAL"${{ matrix.special }}" == '; minimum version' ]]; then
                        pip install -r ./test_requirement_min_version.txt
                        # Use the minimum versions as constraints so that no other package can upgrade them
                        pip install -e .[test-no-optional] -c ./test_requirement_min_version.txt
                    else
                        # nlesc-CAT still needs `pkg_resources`, which setuptools 82 removed
                        pip install -e .[test] "setuptools<82"
                    fi
                    pip install https://github.com/nlesc-nano/auto-FOX-data/releases/download/1.2.0/Auto_FOX_Data-1.2.0-py3-none-any.whl

            -   name: Info Python
                run: |
                    which python
                    python --version

            -   name: Info installed packages
                run: pip list

            -   name: Run tests
                run: pytest -m "not slow"

            -   name: Run codecov
                uses: codecov/codecov-action@v7
                with:
                    files: ./coverage.xml
                    name: codecov-umbrella
                    token: ${{ secrets.CODECOV_TOKEN }}

    Linting:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
                    persist-credentials: false

            -   name: Set up Python on ubuntu-latest
                uses: actions/setup-python@v7
                with:
                    # Not "3.x": the newest Python can't build the pinned pandas<2
                    python-version: "3.11"

            -   name: Install linters
                run: pip install .[lint]

            -   name: Python info
                run: |
                    which python
                    python --version

            -   name: Installed packages
                run: pip list

            -   name: Run flake8
                run: flake8 FOX tests

            -   name: Run pydocstyle
                run: pydocstyle FOX

    Docs:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
                    persist-credentials: false

            -   name: Set up Python on ubuntu-latest
                uses: actions/setup-python@v7
                with:
                    python-version: "3.13"

            -   name: Install dependencies
                run: pip install -e .[docs]

            -   name: Installed packages
                run: pip list

            -   name: Build the documentation
                run: sphinx-build -W --keep-going -b html docs docs/_build/html
